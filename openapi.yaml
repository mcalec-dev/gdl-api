components:
  schemas:
    User:
      type: object
      properties:
        _id:
          type: string
        username:
          type: string
        email:
          type: string
        roles:
          type: array
          items:
            type: string
        created:
          type: string
          format: date-time
        modified:
          type: string
          format: date-time
        oauth:
          type: object
        sessions:
          type: array
          items:
            type: object
    File:
      type: object
      properties:
        _id:
          type: string
        uuid:
          type: string
        name:
          type: string
        type:
          type: string
        size:
          type: number
        mime:
          type: string
        paths:
          type: object
          properties:
            local:
              type: string
            remote:
              type: string
            relative:
              type: string
        collection:
          type: string
        author:
          type: string
        created:
          type: string
          format: date-time
        modified:
          type: string
          format: date-time
    Directory:
      type: object
      properties:
        _id:
          type: string
        uuid:
          type: string
        name:
          type: string
        type:
          type: string
        size:
          type: number
        paths:
          type: object
        collection:
