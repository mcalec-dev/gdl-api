      description: Add one or more files to an existing pool by their UUIDs
      parameters:
        - in: path
          name: uuid
          required: true
          schema:
            type: string
          description: Pool UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                  description: Array of file UUIDs to add to the pool (required)
              required:
                - files
      responses:
        '200':
          description: Files added to pool successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PoolFileUpdate'
        '400':
          description: Invalid UUID or empty files array
          content:
            application/json:
