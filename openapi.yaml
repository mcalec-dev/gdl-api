openapi: 3.0.3
info:
  title: gdl-api
  description: gdl-api express server
  version: '0.5.0'
servers:
  - url: https://gdl.mcalec.dev/api
    description: production server
  - url: http://localhost:3030/api
    description: local server
tags:
  - name: API
    description: General API information
  - name: Authentication
    description: User authentication and OAuth
  - name: Files
    description: File and directory operations
  - name: Downloads
    description: File downloads
  - name: Uploads
    description: File uploads
  - name: Random
    description: Random file retrieval
  - name: Search
    description: File and directory search
  - name: Statistics
    description: API and system statistics
  - name: Health
    description: Health check endpoints
  - name: User
    description: User profile and settings
  - name: Admin
    description: Administrative operations
  - name: Pools
    description: File pool management
paths:
  /:
    get:
      tags:
        - API
      summary: Get API information and available endpoints
      description: Retrieve general API information, version, and list of available endpoints
      responses:
        '200':
          description: API information with available endpoint URLs
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  version:
                    type: string
                  description:
                    type: string
                  author:
                    type: string
                  keywords:
                    type: array
                    items:
                      type: string
                  license:
                    type: string
                  host:
                    type: string
                  basePath:
                    type: string
                  urls:
                    type: object
                    properties:
                      admin:
                        type: string
                      auth:
                        type: string
                      user:
                        type: string
                      download:
                        type: string
                      files:
                        type: string
                      health:
                        type: string
                      random:
                        type: string
                      search:
                        type: string
                      stats:
                        type: string
                      upload:
                        type: string
                      pool:
                        type: string
  /auth/:
    get:
      tags:
        - Authentication
      summary: Get auth API information
      description: Get available authentication endpoints
      responses:
        '200':
          description: Auth endpoints
          content:
            application/json:
              schema:
                type: object
                properties:
                  urls:
                    type: object
                    properties:
                      check:
                        type: string
                      login:
                        type: string
                      logout:
                        type: string
                      provider:
                        type: string
                      register:
                        type: string
  /auth/check/:
    get:
      tags:
        - Authentication
      summary: Check user authentication status
      description: Check if the current user is authenticated and retrieve their authentication details
      responses:
        '200':
          description: Authentication status and user information
          content:
            application/json:
              schema:
                type: object
                properties:
                  authenticated:
                    type: boolean
                  user:
                    type: object
                  roles:
                    type: array
                    items:
                      type: string
                  oauth:
                    type: object
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/login/:
    post:
      tags:
        - Authentication
      summary: User login with username/email and password
      description: Authenticate a user with their credentials (username or email and password)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: Username or email of the user
                email:
                  type: string
                  description: Email address of the user (alternative to username)
                password:
                  type: string
                  description: User password
              required:
                - password
      responses:
        '204':
          description: User successfully logged in
        '400':
          description: Missing credentials, user not found, or invalid password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: User already logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/logout/:
    post:
      tags:
        - Authentication
      summary: User logout
      description: Log out the authenticated user and destroy their session
      responses:
        '204':
          description: User successfully logged out
        '401':
          description: User not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/register/:
    post:
      tags:
        - Authentication
      summary: User registration
      description: Register a new user with username, email, and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: Unique username for the user
                email:
                  type: string
                  format: email
                  description: Email address of the user
                password:
                  type: string
                  description: Password for the user account
              required:
                - username
                - password
      responses:
        '201':
          description: User successfully registered and logged in
        '400':
          description: Missing required fields or invalid email format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Username or email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/provider/:
    get:
      tags:
        - Authentication
      summary: Get OAuth provider endpoints
      description: Get available OAuth provider endpoints for callback, login, link, and unlink operations
      responses:
        '200':
          description: OAuth provider URLs
          content:
            application/json:
              schema:
                type: object
                properties:
                  urls:
                    type: object
                    properties:
                      callback:
                        type: string
                      login:
                        type: string
                      link:
                        type: string
                      unlink:
                        type: string
  /auth/provider/login/{provider}:
    get:
      tags:
        - Authentication
      summary: Initiate OAuth login
      description: Start OAuth authentication flow for the specified provider
      parameters:
        - in: path
          name: provider
          required: true
          schema:
            type: string
            enum: [github, discord]
          description: OAuth provider name
      responses:
        '302':
          description: Redirect to provider authentication
        '400':
          description: Invalid provider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/provider/callback/{provider}:
    get:
      tags:
        - Authentication
      summary: OAuth callback endpoint
      description: Handle OAuth provider callback after successful authentication
      parameters:
        - in: path
          name: provider
          required: true
          schema:
            type: string
            enum: [github, discord]
          description: OAuth provider name
        - in: query
          name: code
          required: true
          schema:
            type: string
          description: Authorization code from provider
      responses:
        '302':
          description: Redirect to dashboard on success
  /auth/provider/link/{provider}:
    get:
      tags:
        - Authentication
      summary: Link OAuth account to existing user
      description: Link an OAuth provider account to the currently authenticated user
      parameters:
        - in: path
          name: provider
          required: true
          schema:
            type: string
            enum: [github, discord]
          description: OAuth provider name
      responses:
        '302':
          description: Redirect to provider authentication
        '400':
          description: Invalid provider or provider already linked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: User not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/provider/unlink/{provider}:
    get:
      tags:
        - Authentication
      summary: Unlink OAuth account from user
      description: Remove OAuth provider account from the currently authenticated user
      parameters:
        - in: path
          name: provider
          required: true
          schema:
            type: string
            enum: [github, discord]
          description: OAuth provider name
      responses:
        '200':
          description: Provider unlinked successfully
        '400':
          description: Invalid provider or cannot unlink (no other auth method)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: User not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /files/:
    get:
      tags:
        - Files
      summary: Get all files and directories from the root
      description: List all files and directories from the BASE_DIR with optional sorting and pagination
      parameters:
        - in: query
          name: sort
          schema:
            type: string
            enum: [name, size, date, type]
          description: Field to sort by
        - in: query
          name: direction
          schema:
            type: string
            enum: [asc, desc]
          description: Sort direction
        - in: query
          name: limit
          schema:
            type: integer
          description: Maximum number of results (up to PAGINATION_LIMIT)
        - in: query
          name: page
          schema:
            type: integer
          description: Page number for pagination
        - in: query
          name: meta
          schema:
            type: boolean
          description: Include extended file metadata (uuid, hash, sidecar)
      responses:
        '200':
          description: List of files and directories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/File'
        '401':
          description: User not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /files/{collection}/:
    get:
      tags:
        - Files
      summary: Get files from a specific collection
      description: List files and subdirectories within a specific collection
      parameters:
        - in: path
          name: collection
          required: true
          schema:
            type: string
          description: Collection name
        - in: query
          name: sort
          schema:
            type: string
            enum: [name, size, date, type]
          description: Field to sort by
        - in: query
          name: direction
          schema:
            type: string
            enum: [asc, desc]
          description: Sort direction
      responses:
        '200':
          description: List of files in collection
        '400':
          description: Invalid path parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Collection not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /files/{collection}/{author}/:
    get:
      tags:
        - Files
      summary: Get files from a specific author within a collection
      description: List files from a specific author directory within a collection
      parameters:
        - in: path
          name: collection
          required: true
          schema:
            type: string
          description: Collection name
        - in: path
          name: author
          required: true
          schema:
            type: string
          description: Author/subdirectory name
      responses:
        '200':
          description: List of files from author directory
        '404':
          description: Path not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /download/:
    get:
      tags:
        - Downloads
      summary: Download a file using its UUID
      description: Downloads a file from the server using the provided UUID. Supports both GET and POST methods.
      parameters:
        - in: query
          name: uuid
          required: true
          schema:
            type: string
          description: The UUID of the file to download
      responses:
        '200':
          description: File content as binary data
        '400':
          description: Missing or invalid uuid parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: User not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: File not found or not accessible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Downloads
      summary: Download a file using its UUID (POST method)
      description: Downloads a file from the server using the provided UUID via POST body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                uuid:
                  type: string
                  description: The UUID of the file to download
              required:
                - uuid
      responses:
        '200':
          description: File content as binary data
        '400':
          description: Missing or invalid uuid parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: User not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: File not found or not accessible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /upload/:
    post:
      tags:
        - Uploads
      summary: Upload a file to the server
      description: Upload a single file to GridFS storage with size limits
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The file to upload
              required:
                - file
      responses:
        '200':
          description: File uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  fileId:
                    type: string
                    description: The GridFS file ID
        '400':
          description: No file provided or file too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: User not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: File upload failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /uuid/{uuid}/{type}:
    get:
      tags:
        - Files
      summary: Retrieve file or directory information by UUID
      description: Retrieve detailed information about a file or directory using its UUID.
      parameters:
        - in: path
          name: uuid
          required: true
          schema:
            type: string
          description: The UUID of the file or directory to retrieve
        - in: path
          name: type
          required: true
          schema:
            type: string
            enum: [file, directory, uuid, hash, all]
          description: The type of the entry to retrieve (file or directory)
      responses:
        '200':
          description: File or directory information retrieved successfully
        '400':
          description: Invalid UUID or type parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: User not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: File or directory not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /random:
    get:
      tags:
        - Random
      summary: Retrieve a random file
      description: Retrieve a random file from the database with metadata
      responses:
        '200':
          description: Random file metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  file:
                    type: string
                  path:
                    type: string
                  collection:
                    type: string
                  author:
                    type: string
                  size:
                    type: number
                  url:
                    type: string
                  created:
                    type: string
                    format: date-time
                  modified:
                    type: string
                    format: date-time
                  type:
                    type: string
                  hash:
                    type: string
                  uuid:
                    type: string
        '401':
          description: User not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No file found in database
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /random/:
    get:
      tags:
        - Random
      summary: Retrieve a random file (with trailing slash)
      description: Retrieve a random file from the database with metadata
      responses:
        '200':
          description: Random file metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  file:
                    type: string
                  path:
                    type: string
                  collection:
                    type: string
                  author:
                    type: string
                  size:
                    type: number
                  url:
                    type: string
                  created:
                    type: string
                    format: date-time
                  modified:
                    type: string
                    format: date-time
                  type:
                    type: string
                  hash:
                    type: string
                  uuid:
                    type: string
        '401':
          description: User not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No file found in database
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /pool:
    get:
      tags:
        - Pools
      summary: List all file pools
      description: Retrieve a paginated list of all file pools for the authenticated user
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 100
          description: Maximum number of pools to return
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number for pagination
      responses:
        '200':
          description: List of pools with pagination info
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    description: Total number of pools
                  page:
                    type: integer
                  limit:
                    type: integer
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Pool'
        '401':
          description: User not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Pools
      summary: Create a new file pool
      description: Create a new pool to group files together with optional description and tags
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Name of the pool (required)
                description:
                  type: string
                  description: Optional description of the pool
                tags:
                  type: array
                  items:
                    type: string
                  description: Optional array of tags
                files:
                  type: array
                  items:
                    type: string
                  description: Optional array of file UUIDs to include in the pool
              required:
                - name
      responses:
        '201':
          description: Pool created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pool'
        '400':
          description: Invalid pool name or request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: User not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /pool/{uuid}:
    get:
      tags:
        - Pools
      summary: Retrieve a specific pool
      description: Get detailed information about a specific pool by UUID
      parameters:
        - in: path
          name: uuid
          required: true
          schema:
            type: string
          description: Pool UUID
        - in: query
          name: includeFiles
          schema:
            type: boolean
            default: false
          description: Whether to include full file details in the response
      responses:
        '200':
          description: Pool information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pool'
        '400':
          description: Invalid UUID parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: User not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Pool not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - Pools
      summary: Update a file pool
      description: Update pool properties such as name, description, tags, or files
      parameters:
        - in: path
          name: uuid
          required: true
          schema:
            type: string
          description: Pool UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: New pool name
                description:
                  type: string
                  description: New pool description
                tags:
                  type: array
                  items:
                    type: string
                  description: Updated tags array
                files:
                  type: array
                  items:
                    type: string
                  description: Updated file UUIDs array
      responses:
        '200':
          description: Pool updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pool'
        '400':
          description: Invalid UUID or request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: User not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Pool not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Pools
      summary: Delete a file pool
      description: Remove a pool and its associations (files are not deleted)
      parameters:
        - in: path
          name: uuid
          required: true
          schema:
            type: string
          description: Pool UUID
      responses:
        '204':
          description: Pool deleted successfully
        '400':
          description: Invalid UUID parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: User not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Pool not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /pool/{uuid}/files:
    get:
      tags:
        - Pools
